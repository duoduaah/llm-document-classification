[project]
name = "llm-document-classification"
version = "0.1.0"
description = "Document-type classification with LLMs: freeform text, LLM judges and other languages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.2.0",
    "google-genai>=3.3.0",
    "langdetect>=1.0.9",
    "numpy>=2.5.4",
    "openai>=3.51.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pypdf>=7.0.1",
    "pyspark>=4.3.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "reportlab>=5.1.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.3.0",
]
